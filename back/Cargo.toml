[package]
name = "back"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
# bcrypt = "0.19.1"
jsonwebtoken = "7.2.0"
ts-rs = "11.0.1"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
dotenvy = "0.15.7"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
http = "1.4.2"
bytes = "1.11.1"
http-body-util = "0.1.3"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
bcrypt = "0.19.2"
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.150"
axum-jwt-auth = "0.7.0"
utoipa = { version = "5.5.0", features = ["axum_extras", "macros"] }
tower-cookies = "0.11.0"

[dependencies.uuid]
version = "1.23.4"
features = ["serde"]
